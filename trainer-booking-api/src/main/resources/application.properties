spring.application.name=trainer-booking-api
# CONFIGURACION DE LA BASE DE DATOS
spring.datasource.url=jdbc:mysql://localhost:3306/trainer_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
# Usuario y contrasena de MySQL
spring.datasource.username=root
spring.datasource.password=1234
# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# =========================================
# CONFIGURACION DE JPA / HIBERNATE
# =========================================

# Estrategia de creacion de tablas:
# - create-drop: borra y crea todo al iniciar (solo para desarrollo)
# - update: actualiza tablas existentes sin borrar datos
# - none: no toca la base de datos
# Usaremos "update" porque YA creamos las tablas con SQL manual
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola (util para aprender)
spring.jpa.show-sql=true

# Formatear las consultas SQL para que se lean mejor
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================================
# CONFIGURACION DEL SERVIDOR
# =========================================

# Puerto donde correra la aplicacion (8081 es el default)
server.port=8081

# =========================================
# CONFIGURACION DE LOGS
# =========================================

# Nivel de detalle de los logs (INFO es suficiente por ahora)
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# =========================================
# CONFIGURACION JWT
# =========================================

# Clave secreta para firmar los tokens (en produccion debe ser larga y guardada en variables de entorno)
jwt.secret=miClaveSecretaSuperSeguraParaTrainerBooking2026NoCompartir

# Tiempo de expiracion del token en milisegundos (86400000 = 24 horas)
jwt.expiration=86400000